# ============================================
# CineVault Backend - Application Configuration
# ============================================

# Server
server.port=8080

# MySQL Database Configuration
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=jdbc:mysql://localhost:3306/cinevault_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# JWT Configuration
# Secret key: base64-encoded, at least 256 bits for HS256.
# Override via environment variable JWT_SECRET in production.
jwt.secret=${JWT_SECRET:Y2luZXZhdWx0LXNlY3JldC1rZXktMjAyNi1waGFzZTNCLXN1cGVyLXNlY3VyZS1rZXk=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin Account Bootstrap Configuration
# Override these via environment variables. Do NOT commit real values.
admin.email=${ADMIN_EMAIL:admin@cinevault.com}
admin.password=${ADMIN_PASSWORD:}
admin.name=${ADMIN_NAME:CineVault Admin}

# Logging
logging.level.com.cinevault=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
